    <title>Privilegiados App</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-reload when Vite chunks become stale after a new deploy
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('Failed to fetch dynamically imported module')) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('Failed to fetch dynamically imported module')) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
      // Clear the flag on successful load
      sessionStorage.removeItem('chunk_reload');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
