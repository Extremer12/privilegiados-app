<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Privilegiados" />
    <meta name="description" content="Plataforma del ministerio de alabanza para gestionar canciones, letras, acordes, audios y coordinar ensayos." />
    <meta name="keywords" content="alabanza, adoración, ministerio musical, grupo de alabanza, canciones cristianas, letras, acordes, ensayos" />
    
    <meta property="og:title" content="Privilegiados App - Ministerio de Alabanza" />
    <meta property="og:description" content="Plataforma completa para gestionar tu ministerio musical. Canciones, foro interno, perfiles y calendario de ensayos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://privilegiados.vercel.app" />
    <meta property="og:image" content="/logo.jpg" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privilegiados App - Ministerio de Alabanza" />
    <meta name="twitter:description" content="Conéctate, ensaya y crece junto a tu ministerio de alabanza" />
    <meta name="twitter:image" content="/logo.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <script>
      (function() {
        const savedTheme = localStorage.getItem("theme") || "dark";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Privilegiados App</title>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0e11; color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 9999;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
          <div style="position: relative;">
            <div style="position: absolute; inset: -15px; background: rgba(217, 160, 50, 0.15); border-radius: 50%; filter: blur(20px);"></div>
            <img src="/logo.jpg" alt="Privilegiados App" style="position: relative; width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(217, 160, 50, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5);" />
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <h1 style="font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; margin: 0; text-shadow: 0 2px 10px rgba(217, 160, 50, 0.3);">Privilegiados App</h1>
            <div style="display: flex; gap: 6px; align-items: center; height: 16px; margin-top: 8px;">
              <div class="initial-dot" style="width: 8px; height: 8px; background-color: #fbbf24; border-radius: 50%; animation: initial-bounce 1s infinite ease-in-out; animation-delay: -0.32s;"></div>
              <div class="initial-dot" style="width: 8px; height: 8px; background-color: #fbbf24; border-radius: 50%; animation: initial-bounce 1s infinite ease-in-out; animation-delay: -0.16s;"></div>
              <div class="initial-dot" style="width: 8px; height: 8px; background-color: #fbbf24; border-radius: 50%; animation: initial-bounce 1s infinite ease-in-out;"></div>
            </div>
          </div>
        </div>
      </div>
      <style>
        @keyframes initial-bounce {
          0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
          40% { transform: scale(1); opacity: 1; }
        }
      </style>
    </div>
    <script>
      // Auto-reload when Vite chunks become stale after a new deploy
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('Failed to fetch dynamically imported module')) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('Failed to fetch dynamically imported module')) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
      // Clear the flag on successful load
      sessionStorage.removeItem('chunk_reload');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
